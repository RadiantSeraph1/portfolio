<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="description" content="Radiant AI — a free AI chat assistant on Samuel Maclar's website." />
    <meta name="theme-color" content="#14120f" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%23d9a441'/%3E%3Ctext x='32' y='41' font-family='monospace' font-size='26' font-weight='700' text-anchor='middle' fill='white'%3EAI%3C/text%3E%3C/svg%3E"
    />
    <title>Radiant AI | Samuel Maclar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/ai/ai.css" />
    <script>
      try {
        const t = localStorage.getItem("samuel-portfolio-theme");
        if (t) document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" id="sidebar" aria-label="Chat history">
        <div class="sidebar-top">
          <a class="brand" href="/" aria-label="Back to Samuel Maclar home">
            <span class="brand-mark">SM</span>
            <span>Radiant AI</span>
          </a>
          <button class="icon-btn sidebar-close" type="button" aria-label="Close sidebar">
            <i data-lucide="x"></i>
          </button>
        </div>
        <button class="new-chat" type="button">
          <i data-lucide="square-pen"></i>
          <span>New chat</span>
        </button>
        <nav class="chat-list" aria-label="Previous chats"></nav>
        <div class="sidebar-bottom">
          <button class="side-link sync-btn" id="sync-btn" type="button"><i data-lucide="cloud-off"></i><span>Sync chats</span></button>
          <a class="side-link" href="/"><i data-lucide="arrow-left"></i><span>Back to portfolio</span></a>
          <button class="side-link theme-toggle" type="button"><i data-lucide="sun"></i><span>Theme</span></button>
        </div>
      </aside>
      <div class="scrim" hidden></div>

      <main class="main">
        <header class="topbar">
          <button class="icon-btn sidebar-open" type="button" aria-label="Open sidebar" aria-expanded="false">
            <i data-lucide="menu"></i>
          </button>
          <h1 class="chat-title">New chat</h1>
          <button class="icon-btn new-chat-mini" type="button" aria-label="New chat">
            <i data-lucide="square-pen"></i>
          </button>
        </header>

        <section class="messages" aria-live="polite">
          <div class="empty" id="empty">
            <span class="brand-mark big">AI</span>
            <h2>How can I help you today?</h2>
            <div class="suggestions">
              <button type="button">What's the latest news in Ghana tech?</button>
              <button type="button">Write a JavaScript debounce function</button>
              <button type="button">Help me draft a professional email</button>
              <button type="button">What does Samuel Maclar build?</button>
            </div>
          </div>
          <div class="thread" id="thread"></div>
        </section>

        <form class="composer" id="composer">
          <div class="composer-box">
            <textarea id="input" rows="1" placeholder="Ask anything" aria-label="Message" maxlength="8000"></textarea>
            <div class="composer-row">
              <button class="tool-toggle" id="search-toggle" type="button" aria-pressed="true" title="Let the AI search the web for current information">
                <i data-lucide="globe"></i>
                <span>Web search</span>
              </button>
              <button class="tool-toggle claude-toggle" id="claude-toggle" type="button" aria-pressed="false" hidden title="Answer with Claude (owner only)">
                <i data-lucide="sparkles"></i>
                <span>Claude</span>
              </button>
              <span class="composer-spacer"></span>
              <button class="send" type="submit" aria-label="Send message">
                <i data-lucide="arrow-up"></i>
              </button>
            </div>
          </div>
          <p class="disclaimer">Radiant AI can make mistakes. Check important info.</p>
        </form>
      </main>
    </div>

    <dialog class="sync-dialog" id="sync-dialog" aria-labelledby="sync-title">
      <form method="dialog" id="sync-form">
        <h2 id="sync-title">Sync chats across devices</h2>
        <p class="sync-help">Owner only. Enter the sync password to keep your chats in sync on every device you sign in on.</p>
        <label for="sync-password">Password</label>
        <input id="sync-password" type="password" autocomplete="current-password" required />
        <p class="sync-error" id="sync-error" role="alert" hidden></p>
        <div class="sync-actions">
          <button type="button" class="ghost-btn" id="sync-cancel">Cancel</button>
          <button type="submit" class="retry-btn" id="sync-submit">Sign in</button>
        </div>
      </form>
    </dialog>

    <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    <script src="/ai/ai.js"></script>
  </body>
</html>
